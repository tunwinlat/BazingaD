name: Extension browser smoke tests

on:
  push:
    branches: [extension/foundation]
    paths:
      - 'extension/**'
      - '.github/workflows/extension-smoke.yml'
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/extension-smoke.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node extension/build.mjs
      - name: Install test tools
        run: |
          python -m pip install selenium==4.52.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdotool
      - name: Install Chrome for Testing
        if: matrix.browser == 'chrome'
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome-test"
          binary=$(find "$RUNNER_TEMP/chrome-test" -type f -path '*/chrome-linux64/chrome' -print -quit)
          test -x "$binary"
          version=$("$binary" --version | awk '{print $NF}')
          npx --yes @puppeteer/browsers install "chromedriver@$version" --path "$RUNNER_TEMP/chrome-test"
          driver=$(find "$RUNNER_TEMP/chrome-test" -type f -path '*/chromedriver-linux64/chromedriver' -print -quit)
          test -x "$driver"
          echo "CHROME_TEST_BINARY=$binary" >> "$GITHUB_ENV"
          echo "CHROME_TEST_DRIVER=$driver" >> "$GITHUB_ENV"
      - name: Test extension in the browser
        env:
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: xvfb-run -a --server-args='-screen 0 1280x900x24' python extension/tests/smoke.py ${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bazingad-${{ matrix.browser }}-diagnostics
          path: extension-test-screenshots/
