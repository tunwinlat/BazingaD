name: Docker release

on:
  pull_request:
    paths:
      - '.github/workflows/docker-release.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-entrypoint.sh'
      - 'check-and-seed.js'
      - 'docker-compose.yml'
      - 'package*.json'
      - 'prisma/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and smoke-test image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ || "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag must be v followed by the version in package.json (v$version)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build production image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bazingad:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check startup and database health
        run: |
          cleanup() {
            docker logs bazingad-smoke
            docker rm -f bazingad-smoke
          }
          trap cleanup EXIT
          docker run --detach --name bazingad-smoke --publish 127.0.0.1::3000 bazingad:smoke-test
          address=$(docker port bazingad-smoke 3000/tcp)
          curl --fail --silent --show-error --retry 45 --retry-delay 2 --retry-connrefused \
            "http://$address/api/health"

  publish:
    name: Publish to GHCR
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Check if this is the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          latest=false
          if [[ "$PRERELEASE" == "false" && "$RELEASE_TAG" != *-* ]]; then
            latest_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json isLatest,tagName --jq '.[] | select(.isLatest) | .tagName')
            if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
              latest=true
            fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest }}
          labels: |
            org.opencontainers.image.licenses=MPL-2.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish release image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha

      - name: Verify published image digest
        env:
          IMAGE: ${{ steps.metadata.outputs.tags }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          read -r tag <<< "$IMAGE"
          docker buildx imagetools inspect "${tag%%:*}@$DIGEST" >/dev/null
          printf '%s\n' "`$tag` → `$DIGEST`" >> "$GITHUB_STEP_SUMMARY"
