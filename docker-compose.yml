version: '3.8'

services:
  startpage:
    image: twlatx/bazingad:latest
    container_name: bazingad
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-BazingaD}
    volumes:
      - bazingad-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  bazingad-data:
